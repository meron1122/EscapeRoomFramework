# Two doors into one broker, each with its own rules.
per_listener_settings true
persistence false
log_dest stdout

# Door 1: the engine, on localhost only. Full access.
listener 1883 127.0.0.1
allow_anonymous true

# Door 2: browsers, through the proxy (wss://<host>/mqtt). Anonymous, but limited by the ACL to what a room's
# sensors and screens need: it can act as the room's hardware and nothing else. Few clients.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /home/sprite/app/deploy/browser.acl
max_connections 40
# This limit is the broker's, not the door's: it also binds the engine, whose room definition (about 35 kB, which
# the browser needs to know what a puzzle's answer looks like) must pass. 8 kB here once dropped it silently.
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 100
